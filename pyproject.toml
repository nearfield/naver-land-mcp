[project]
name = "naver-land-mcp"
version = "0.2.0"
description = "Local Naver Real Estate MCP extension for office/store studio research and apartment listings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.3,<3",
    "fastmcp>=4.0,<5",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = false
