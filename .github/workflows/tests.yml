name: offline-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest pytest-cov ruff
      - run: ruff check .
      - run: pytest --cov=articles --cov=studio --cov-branch --cov-report=term-missing --cov-fail-under=85
      - run: python scripts/verify.py --output .verification/offline.json
